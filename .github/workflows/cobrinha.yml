name: Generate Datas

on:
  schedule:
    # Executa a cada 12 horas (no minuto 0)
    - cron: "0 */12 * * *"
  workflow_dispatch:

# PERMISSÃO OBRIGATÓRIA: Permite que o workflow faça push dos arquivos gerados na branch output
permissions:
  contents: write

jobs:
  build:
    name: Jobs to update datas
    runs-on: ubuntu-latest
    steps:
      # 1. Gera a animação da cobrinha (Versão v3 atualizada)
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 2. Publica o resultado na branch 'output' (Versão v4 atualizada)
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
